name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore permanent test signing key
        if: github.event_name != 'pull_request'
        env:
          ORDERS_DEBUG_KEYSTORE_BASE64: ${{ secrets.ORDERS_DEBUG_KEYSTORE_BASE64 }}
        run: python3 scripts/prepare_ci_signing.py

      - name: Install Android platform
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager is missing from $SDK_ROOT/cmdline-tools"
            ls -la "$SDK_ROOT" || true
            exit 1
          fi
          echo "Using $SDKMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Verify wrapper
        run: |
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f gradlew
          chmod +x gradlew
          ./gradlew --version

      - name: Domain tests
        run: ./gradlew :core:domain:test --no-daemon

      - name: Android lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Build APK and Android test APK
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :core:data:assembleDebugAndroidTest --no-daemon

      - name: Verify migration SQL
        run: python3 tests/verify_migration_sql.py

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run database and group screen tests on Android
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          disable-animations: true
          script: bash scripts/run_connected_tests.sh

      - name: Verify screen images
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ('group-table.png', 'group-completed.png', 'group-large-font.png', 'group-inline-large-font.png', 'groups-list.png', 'orders-list.png', 'orders-compact-large-font.png', 'order-editor-flags.png', 'order-editor-compact.png', 'order-editor-summary.png', 'order-delete-button.png', 'position-editor.png', 'formula-order.png', 'formula-group.png', 'price-history.png'):
              data = (Path('artifacts') / name).read_bytes()
              assert data.startswith(b'\x89PNG\r\n\x1a\n') and len(data) > 1000, name
          PY

      - name: Upload verification reports and group screen previews
        uses: actions/upload-artifact@v4
        with:
          name: Orders-verification-${{ github.run_number }}
          path: |
            artifacts/*.png
            **/build/reports/androidTests/**
            **/build/test-results/**
          if-no-files-found: error
          retention-days: 14

      - name: Verify installable APK signing certificate
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          APK_SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APK_SIGNER" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/orders-signature.txt"
          cat "$RUNNER_TEMP/orders-signature.txt"
          CERTIFICATE="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/orders-signature.txt")"
          test "$CERTIFICATE" = "82a94fb920b5eb7ef1afe9ab250b0f59d3fecf52ec789fad9734b83eb7a73200"

      - name: Upload installable APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Orders-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove restored signing key
        if: always() && github.event_name != 'pull_request'
        run: rm -f "$RUNNER_TEMP/orders-debug.keystore"

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ github.run_number }}
          path: |
            artifacts/**
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
